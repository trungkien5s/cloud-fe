<div class="portal-page">
  <div class="portal-shell portal-shell--narrow">
    <div class="portal-page-header">
        <div>
            <h1 class="portal-page-title">Đổi mật khẩu</h1>
            <p class="portal-page-subtitle">Cập nhật mật khẩu định kỳ để bảo vệ tài khoản và tài nguyên cloud.</p>
        </div>
    </div>

    <nz-card>
        <nz-spin [nzSpinning]="isLoading" nzTip="Đang tải thông tin...">
            <nz-alert
                *ngIf="errorMessage"
                nzType="error"
                nzShowIcon
                [nzMessage]="errorMessage"
                class="form-alert">
            </nz-alert>

            <div *ngIf="!isLoading && userInfo" class="password-panel">
                <nz-alert
                    *ngIf="passwordMessage"
                    nzType="success"
                    nzShowIcon
                    [nzMessage]="passwordMessage"
                    class="form-alert">
                </nz-alert>

                <nz-alert
                    *ngIf="passwordError"
                    nzType="error"
                    nzShowIcon
                    [nzMessage]="passwordError"
                    class="form-alert">
                </nz-alert>

                <nz-form-item>
                    <nz-form-label nzRequired>Mật khẩu hiện tại</nz-form-label>
                    <nz-form-control>
                        <input nz-input type="password" [(ngModel)]="passwordData.currentPassword" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label nzRequired>Mật khẩu mới</nz-form-label>
                    <nz-form-control>
                        <input nz-input type="password" [(ngModel)]="passwordData.newPassword" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label nzRequired>Xác nhận mật khẩu mới</nz-form-label>
                    <nz-form-control>
                        <input nz-input type="password" [(ngModel)]="passwordData.confirmPassword" />
                    </nz-form-control>
                </nz-form-item>

                <div class="form-actions">
                    <button
                        nz-button
                        nzType="primary"
                        [nzLoading]="isChangingPassword"
                        [disabled]="isChangingPassword"
                        (click)="onChangePassword()">
                        <span nz-icon nzType="save" *ngIf="!isChangingPassword"></span>
                        Cập nhật mật khẩu
                    </button>
                </div>
            </div>
        </nz-spin>
    </nz-card>
  </div>
</div>
